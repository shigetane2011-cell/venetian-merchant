// ===== SOUND (Web Audio, no external files) =====
const SFX = (() => {
  let ctx = null, muted = false;
  const ensure = () => {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
    } catch (e) {}
  };
  function beep(freq, dur, type, gain, delay, endFreq) {
    if (!ctx) return;
    try {
      const o = ctx.createOscillator(), g = ctx.createGain(), st = ctx.currentTime + (delay || 0);
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, st);
      if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, st + dur);
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(gain || 0.12, st + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(st); o.stop(st + dur + 0.05);
    } catch (e) {}
  }
  const lib = {
    click: () => beep(880, 0.06, "triangle", 0.05),
    place: () => { beep(523, 0.09, "triangle", 0.1); beep(784, 0.12, "triangle", 0.08, 0.06); },
    steal: () => { beep(200, 0.25, "sawtooth", 0.08, 0, 90); beep(600, 0.08, "square", 0.04, 0.02, 300); },
    contract: () => { beep(392, 0.12, "triangle", 0.1); beep(494, 0.12, "triangle", 0.1, 0.09); beep(587, 0.2, "triangle", 0.1, 0.18); },
    discard: () => beep(300, 0.12, "sine", 0.06, 0, 180),
    win: () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.18, "triangle", 0.11, i * 0.13)); },
    lose: () => { [400, 340, 280, 220].forEach((f, i) => beep(f, 0.22, "sine", 0.09, i * 0.15)); },
    tie: () => { beep(440, 0.2, "sine", 0.08); beep(440, 0.2, "sine", 0.08, 0.25); },
    achieve: () => { [784, 988, 1319].forEach((f, i) => beep(f, 0.15, "triangle", 0.1, i * 0.09)); },
  };
  return {
    unlock: ensure,
    setMuted: (m) => { muted = m; },
    play: (name) => { if (muted) return; ensure(); if (lib[name]) lib[name](); },
  };
})();

// ===== STORAGE =====
function loadLS(key, def) {
  try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); } catch (e) { return def; }
}
function saveLS(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

// ===== ENGINE =====
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function cardDir(c){return c[0];}
function cardVal(c){return parseInt(c.substring(1));}
function sortCards(cards){return[...cards].sort((a,b)=>{const d=DIRS.indexOf(cardDir(a))-DIRS.indexOf(cardDir(b));return d!==0?d:cardVal(a)-cardVal(b);});}
function buildDeck(){const d=[];for(const dir of DIRS)for(let i=1;i<=10;i++)d.push(`${dir}${i}`);return d;}
function getMaxInRoute(board,dir){const c=board[dir];return c.length===0?0:Math.max(...c.map(cardVal));}
function canPlace(card,board){const d=cardDir(card),v=cardVal(card);if(v===1)return board[d].length===0;return v>getMaxInRoute(board,d);}
function getPlayableCards(hand,board){return hand.filter(c=>canPlace(c,board));}
function getContractableDirs(board,contracts){return DIRS.filter(d=>board[d].length===0&&!contracts[d]);}

function pickEvent(){
  const pool=[{type:"wind",dir:"N"},{type:"wind",dir:"E"},{type:"wind",dir:"S"},{type:"wind",dir:"W"},
    {type:"calm"},{type:"calm"},{type:"pirate"},{type:"pirate"},{type:"fair"},{type:"fair"}];
  return pool[Math.floor(Math.random()*pool.length)];
}
// Event-aware score: wind = x1.5 on one route (before contract doubling),
// calm = contract penalty -10, fair = +5 flat for routes with 3+ cards
function calcScoreEx(cards,con,dir,ev){
  let t=cards.reduce((s,c)=>s+cardVal(c),0);
  if(ev&&ev.type==="wind"&&ev.dir===dir)t=Math.ceil(t*1.5);
  if(con)t=t*2-(ev&&ev.type==="calm"?10:20);
  if(ev&&ev.type==="fair"&&cards.length>=3)t+=5;
  return t;
}
function totalScore(board,con,ev){return DIRS.reduce((s,d)=>s+calcScoreEx(board[d],con[d],d,ev),0);}
function eventName(ev,t){
  if(!ev)return"";
  if(ev.type==="wind")return`${t.events.wind.name}【${t.dirs[ev.dir]}】`;
  return t.events[ev.type].name;
}

function initGame(difficulty,eventOn){
  const deck=shuffle(buildDeck());const first=Math.random()<0.5?"user":"ai";
  let aiHand=deck.slice(7,14),rest=deck.slice(14);
  // Hard: one opening mulligan - a weak hand goes back and gets redrawn
  if(difficulty==="hard"&&aiHand.reduce((s,c)=>s+cardVal(c),0)<38){
    const pool=shuffle([...aiHand,...rest]);
    aiHand=pool.slice(0,7);rest=pool.slice(7);
  }
  return{deck:rest,userHand:sortCards(deck.slice(0,7)),aiHand:sortCards(aiHand),
    userBoard:{N:[],E:[],S:[],W:[]},aiBoard:{N:[],E:[],S:[],W:[]},
    userCon:{N:false,E:false,S:false,W:false},aiCon:{N:false,E:false,S:false,W:false},
    grave:[],turnPlayer:first,turnNumber:1,phase:first==="user"?"selectCard":"aiTurn",
    selectedCard:null,logs:[],dandoloMsg:"",dandoloMood:"⚓",gameOver:false,lastPlaced:null,
    difficulty:difficulty||"normal",event:eventOn?pickEvent():null,stealCounts:{user:0,ai:0}};
}

function processTurn(state,player,action,target){
  const s=JSON.parse(JSON.stringify(state));
  const isUser=player==="user";
  const hk=isUser?"userHand":"aiHand",bk=isUser?"userBoard":"aiBoard";
  const obk=isUser?"aiBoard":"userBoard",ck=isUser?"userCon":"aiCon";
  let drawNeeded=false,logEntry=null;
  s.lastPlaced=null;
  if(action==="contract"){
    s[ck][target]=true;logEntry={type:"contract",player,dir:target};drawNeeded=false;
  }else if(action==="discard"){
    const idx=s[hk].indexOf(target);
    if(idx>=0){s[hk].splice(idx,1);s.grave.push(target);logEntry={type:"discard",player,dir:cardDir(target),val:cardVal(target)};drawNeeded=true;}
  }else if(action==="place"){
    const card=target,d=cardDir(card),v=cardVal(card),idx=s[hk].indexOf(card);
    if(idx>=0){
      s[hk].splice(idx,1);s[bk][d].push(card);s.lastPlaced={player,card,dir:d,steal:false};
      if(v===1){
        const oppCol=s[obk][d];
        if(oppCol.length>0){
          const stolen=oppCol.pop();s[hk].push(stolen);s[hk]=sortCards(s[hk]);
          s.lastPlaced.steal=true;
          if(s.stealCounts)s.stealCounts[player]=(s.stealCounts[player]||0)+1;
          logEntry={type:"stealHit",player,dir:d,val:1,stolenVal:cardVal(stolen)};
          drawNeeded=!!(s.event&&s.event.type==="pirate");
        }
        else{logEntry={type:"stealMiss",player,dir:d,val:1};drawNeeded=true;}
      }else{logEntry={type:"place",player,dir:d,val:v};drawNeeded=true;}
    }
  }
  if(drawNeeded&&s.deck.length>0){const drawn=s.deck.shift();s[hk].push(drawn);s[hk]=sortCards(s[hk]);}
  if(logEntry)s.logs.push(logEntry);
  s.turnNumber+=1;s.turnPlayer=isUser?"ai":"user";
  if(s.deck.length===0){s.gameOver=true;s.phase="gameOver";}else{s.phase=isUser?"aiTurn":"selectCard";}
  return s;
}

function renderLog(entry,lang){
  const t=TEXTS[lang],tpl=t.logTpl[entry.type];if(!tpl)return"";
  return tpl.replace("{p}",t.players[entry.player]).replace(/{d}/g,t.dirs[entry.dir]||entry.dir).replace("{v}",entry.val||"").replace("{sv}",entry.stolenVal||"");
}

// ===== DANDOLO AI =====
function getUnknownCards(state){
  const all=new Set(buildDeck());
  for(const c of state.aiHand)all.delete(c);
  for(const d of DIRS){for(const c of state.aiBoard[d])all.delete(c);for(const c of state.userBoard[d])all.delete(c);}
  for(const c of state.grave)all.delete(c);return[...all];
}
function countUnplaceableAfter(state,cardToPlace){
  const simBoard=JSON.parse(JSON.stringify(state.aiBoard));simBoard[cardDir(cardToPlace)].push(cardToPlace);
  const simState={aiHand:state.aiHand.filter(c=>c!==cardToPlace),aiBoard:simBoard,userBoard:state.userBoard,grave:state.grave};
  const unknown=getUnknownCards(simState);let count=0;
  for(const c of unknown){const cd=cardDir(c),cv=cardVal(c),mx=getMaxInRoute(simBoard,cd);
    if(cv===1){if(simBoard[cd].length>0)count++;}else{if(cv<=mx)count++;}}
  return count;
}
// Endgame optimizer: find optimal card placement plan from hand to maximize total score
// Considers remaining turns to avoid placing low cards when only high cards can fit
function findOptimalPlan(hand, board, con, remainingTurns, ev) {
  const windDir = ev && ev.type === "wind" ? ev.dir : null;
  // Group hand cards by direction (exclude 1s - they're for stealing, not scoring)
  const byDir = {};
  for (const d of DIRS) {
    byDir[d] = hand.filter(c => cardDir(c) === d && cardVal(c) > 1)
      .sort((a, b) => cardVal(a) - cardVal(b));
  }

  // For each direction, find placeable cards in ascending order
  const dirPlans = [];
  for (const d of DIRS) {
    const currentMax = getMaxInRoute(board, d);
    const candidates = byDir[d].filter(c => cardVal(c) > currentMax);
    if (candidates.length === 0) continue;

    const multiplier = (con[d] ? 2 : 1) * (windDir === d ? 1.5 : 1);

    // We must place in ascending order; taking the highest N candidates is
    // always a valid ascending subsequence, so it's the best N-card subset.
    const subsets = [];
    for (let take = 1; take <= candidates.length; take++) {
      const chosen = candidates.slice(candidates.length - take);
      const score = chosen.reduce((s, c) => s + cardVal(c), 0) * multiplier;
      subsets.push({ cards: chosen, score, count: take });
    }

    dirPlans.push({ dir: d, subsets });
  }

  if (dirPlans.length === 0) return { plan: [], total: 0 };

  // Allocate remaining turns across directions to maximize total score.
  // At most one subset per direction; with 4 directions brute force is fine.
  let bestCombo = [];
  let bestTotal = 0;
  const dirOptions = dirPlans.map(dp => [null, ...dp.subsets.map(sub => ({ ...sub, dir: dp.dir }))]);

  function searchCombos(idx, turnsLeft, currentCombo, currentScore) {
    if (idx >= dirOptions.length) {
      if (currentScore > bestTotal) {
        bestTotal = currentScore;
        bestCombo = [...currentCombo];
      }
      return;
    }
    for (const opt of dirOptions[idx]) {
      if (opt === null) {
        searchCombos(idx + 1, turnsLeft, currentCombo, currentScore);
      } else if (opt.count <= turnsLeft) {
        currentCombo.push(opt);
        searchCombos(idx + 1, turnsLeft - opt.count, currentCombo, currentScore + opt.score);
        currentCombo.pop();
      }
    }
  }
  searchCombos(0, remainingTurns, [], 0);

  const plan = bestCombo.map(opt => ({ dir: opt.dir, cards: opt.cards, contribution: opt.score }));
  return { plan, total: bestTotal };
}

// Get the next card to play from optimal plan
function getEndgameCard(hand, board, con, deckSize, ev) {
  const remainingTurns = Math.ceil(deckSize / 2) + 1; // +1 for current turn
  const { plan } = findOptimalPlan(hand, board, con, remainingTurns, ev);
  if (plan.length === 0) return null;

  // Priority: contracted empty dirs first, then by contribution per card
  plan.sort((a, b) => {
    const aEmpty = con[a.dir] && board[a.dir].length === 0;
    const bEmpty = con[b.dir] && board[b.dir].length === 0;
    if (aEmpty !== bEmpty) return aEmpty ? -1 : 1;
    return (b.contribution / b.cards.length) - (a.contribution / a.cards.length);
  });

  // From highest priority direction, play the LOWEST card in the plan (ascending order)
  return plan[0].cards[0];
}

// Value of stealing from a direction: opponent's score loss + value of card gained
function calcStealValueEx(stealDir, userBoard, userCon, ev) {
  const oppCards = userBoard[stealDir];
  if (oppCards.length === 0) return 0;
  const maxVal = Math.max(...oppCards.map(cardVal));
  const before = calcScoreEx(oppCards, userCon[stealDir], stealDir, ev);
  const after = calcScoreEx(oppCards.slice(0, -1), userCon[stealDir], stealDir, ev);
  return (before - after) + maxVal;
}

// Easy: hesitant contracts, misses steals, sometimes wastes high cards
function aiDecideEasy(state){
  const hand=state.aiHand,board=state.aiBoard;
  const contractable=getContractableDirs(board,state.aiCon);
  for(const d of contractable){
    const dc=hand.filter(c=>cardDir(c)===d&&cardVal(c)>1);
    const total=dc.reduce((s,c)=>s+cardVal(c),0);
    if(dc.length>=3&&total>=22&&Math.random()<0.6)return{action:"contract",target:d};
  }
  const steals=hand.filter(c=>cardVal(c)===1&&board[cardDir(c)].length===0&&state.userBoard[cardDir(c)].length>0);
  const good=steals.filter(c=>Math.max(...state.userBoard[cardDir(c)].map(cardVal))>=7);
  if(good.length>0&&Math.random()<0.75)return{action:"place",target:good[0]};
  const playable=getPlayableCards(hand,board).filter(c=>cardVal(c)>1);
  if(playable.length>0){
    const r=Math.random();
    if(r<0.2){ // blunder: burn a high card, blocking the lower ones
      const byHigh=[...playable].sort((a,b)=>cardVal(b)-cardVal(a));
      return{action:"place",target:byHigh[0]};
    }
    if(r<0.5)return{action:"place",target:playable[Math.floor(Math.random()*playable.length)]};
    const byLow=[...playable].sort((a,b)=>cardVal(a)-cardVal(b));
    return{action:"place",target:byLow[0]};
  }
  const ap=getPlayableCards(hand,board);
  if(ap.length>0)return{action:"place",target:ap[Math.floor(Math.random()*ap.length)]};
  const dead=hand.filter(c=>!canPlace(c,board));
  if(dead.length>0)return{action:"discard",target:dead[Math.floor(Math.random()*dead.length)]};
  return{action:"discard",target:hand[0]};
}

// Normal/Hard: contract evaluation -> steal -> endgame optimizer -> minimize dead cards
function aiDecideStd(s,hard){
  const hand=s.aiHand,board=s.aiBoard,con=s.aiCon,turn=s.turnNumber,ev=s.event;
  const calm=ev&&ev.type==="calm",windDir=ev&&ev.type==="wind"?ev.dir:null;

  // Step 1: Contract (event-aware)
  const contractable=getContractableDirs(board,con),cc=[];
  for(const d of contractable){
    const dc=hand.filter(c=>cardDir(c)===d&&cardVal(c)>1);if(dc.length===0)continue;
    const total=dc.reduce((s2,c)=>s2+cardVal(c),0);
    const eff=windDir===d?Math.ceil(total*1.5):total;
    const high=dc.filter(c=>cardVal(c)>=6),vhigh=dc.filter(c=>cardVal(c)>=8),minV=Math.min(...dc.map(cardVal));
    const reqA=16-(calm?4:0),reqB=23-(calm?4:0);
    let ok=false;
    if(high.length>=2&&eff-turn>=reqA)ok=true;
    if(!ok&&eff>=reqB){const sorted=dc.map(cardVal).sort((a,b)=>a-b);let can=true;for(let i=1;i<sorted.length;i++)if(sorted[i]<=sorted[i-1]){can=false;break;}if(can)ok=true;}
    if(!ok&&turn<=2&&vhigh.length>=2&&!hard)ok=true;
    if(!ok&&turn>=10&&eff>=reqB)ok=true;
    if(ok)cc.push({dir:d,minV,pri:windDir===d?-1:0});
  }
  if(cc.length>0){cc.sort((a,b)=>a.pri-b.pri||a.minV-b.minV);return{action:"contract",target:cc[0].dir};}

  // Step 2: Steal - evaluate total impact (opponent damage + card gained).
  // Hard reads the opponent's hand for timing: if they hold higher cards for
  // that route the prize will grow, so it waits; if not, it takes it now.
  const stealCandidates=hand.filter(c=>cardVal(c)===1&&board[cardDir(c)].length===0);
  if(stealCandidates.length>0){
    const evaluated=stealCandidates.map(c=>{
      const d=cardDir(c);
      return{card:c,dir:d,value:calcStealValueEx(d,s.userBoard,s.userCon,ev)};
    }).filter(e=>{
      if(!hard)return e.value>=6;
      if(s.userCon[e.dir])return e.value>=4;
      const mx=getMaxInRoute(s.userBoard,e.dir);
      const willGrow=s.userHand.some(c2=>cardDir(c2)===e.dir&&cardVal(c2)>mx);
      return willGrow?e.value>=14:e.value>=6;
    }).sort((a,b)=>b.value-a.value);
    if(evaluated.length>0)return{action:"place",target:evaluated[0].card};
  }

  // === ENDGAME MODE ===
  const egThresh=14;
  if(s.deck.length<=egThresh){
    const endgameCard=getEndgameCard(hand,board,con,s.deck.length,ev);
    // Hard compares a steal against the value of its best placement this turn
    let egValue=0;
    if(endgameCard){const egd=cardDir(endgameCard);egValue=cardVal(endgameCard)*(con[egd]?2:1)*(windDir===egd?1.5:1);}
    if(stealCandidates.length>0){
      const endgameSteals=stealCandidates.map(c=>{
        const d=cardDir(c);
        const oppCards=s.userBoard[d];
        if(oppCards.length===0)return{card:c,netGain:-Infinity};
        const stealVal=calcStealValueEx(d,s.userBoard,s.userCon,ev);
        const bonus=s.userCon[d]?20:0; // Extra weight for disrupting contracts
        return{card:c,netGain:stealVal+bonus};
      }).filter(e=>e.netGain>0).sort((a,b)=>b.netGain-a.netGain);
      if(endgameSteals.length>0&&(!hard||endgameSteals[0].netGain>=egValue))return{action:"place",target:endgameSteals[0].card};
    }
    if(endgameCard)return{action:"place",target:endgameCard};
  }

  // === NORMAL MODE: minimize unplaceable cards ===
  // Hard also avoids occupying a route where it still holds a live steal-1
  const playable=getPlayableCards(hand,board).filter(c=>{if(cardVal(c)===1&&!con[cardDir(c)])return false;return true;});
  if(playable.length>0){
    let best=null,bs=Infinity;
    for(const card of playable){
      const d=cardDir(card),up=countUnplaceableAfter(s,card),hc=board[d].length>0?0:1,ce=(con[d]&&board[d].length===0)?-500:0,cb=con[d]?-50:0,wb=(hard&&windDir===d)?-8:0;
      const killsOwnOne=(hard&&cardVal(card)>1&&board[d].length===0&&hand.some(c2=>c2!==card&&cardDir(c2)===d&&cardVal(c2)===1))?40:0;
      const score=up*100+hc+ce+cb+wb+killsOwnOne;
      if(score<bs){bs=score;best=card;}}
    if(best)return{action:"place",target:best};
  }
  const ap=getPlayableCards(hand,board);
  if(ap.length>0){let best=null,bs=Infinity;for(const card of ap){const d=cardDir(card),up=countUnplaceableAfter(s,card),hc=board[d].length>0?0:1,score=up*100+hc;if(score<bs){bs=score;best=card;}}if(best)return{action:"place",target:best};}
  const dead=hand.filter(c=>!canPlace(c,board)).sort((a,b)=>cardVal(a)-cardVal(b));
  if(dead.length>0)return{action:"discard",target:dead[0]};
  return{action:"discard",target:[...hand].sort((a,b)=>cardVal(a)-cardVal(b))[0]};
}

function aiDecide(state){
  const diff=state.difficulty||"normal";
  if(diff==="easy")return aiDecideEasy(state);
  return aiDecideStd(state,diff==="hard");
}

function getDandolo(lang,action,state){
  const L=TEXTS[lang].dandoloLines,ev=state.event;
  const us=totalScore(state.userBoard,state.userCon,ev),ai=totalScore(state.aiBoard,state.aiCon,ev);
  if(state.gameOver)return ai>us?{text:L.gameOverWin,mood:"😎"}:us>ai?{text:L.gameOverLose,mood:"😫"}:{text:L.gameOverDraw,mood:"🤝"};
  if(action==="steal")return{text:L.steal,mood:"😏"};
  if(action==="stolen")return{text:L.stolen,mood:"😠"};
  if(action==="contract")return{text:L.contract,mood:"📜"};
  if(action==="place")return{text:L.place,mood:"🧐"};
  if(action==="discard")return{text:L.discard,mood:"🫤"};
  if(ai>us+10)return{text:L.winning,mood:"😏"};
  if(us>ai+10)return{text:L.losing,mood:"😰"};
  return{text:L.yourTurn,mood:"🧐"};
}

  const startGame=useCallback(()=>{
    SFX.unlock();SFX.play("click");
    const g=initGame(diff,eventOn);
    const L=t.dandoloLines;
    g.dandoloMsg=diff==="easy"?L.greetingEasy:diff==="hard"?L.greetingHard:L.greeting;
    setGame(g);setContractDir(null);
  },[t,diff,eventOn]);

  // Game over: record stats, career, achievements, fanfare
  useEffect(()=>{if(!game||!game.gameOver||game._recorded)return;
    const ev=game.event;
    const uT=totalScore(game.userBoard,game.userCon,ev),aT=totalScore(game.aiBoard,game.aiCon,ev);
    recordResult(uT,aT);
    const win=uT>aT;
    const nc={games:career.games+1,wins:career.wins+(win?1:0),losses:career.losses+(uT<aT?1:0),draws:career.draws+(uT===aT?1:0)};
    setCareer(nc);saveLS("vm_career",nc);
    const unlocked=new Set(ach);const fresh=[];
    const conCount=DIRS.filter(d=>game.userCon[d]).length;
    const routesUsed=DIRS.filter(d=>game.userBoard[d].length>0).length;
    const check=(id,cond)=>{if(cond&&!unlocked.has(id)){unlocked.add(id);fresh.push(id);}};
    check("first_win",win);
    check("big_win",win&&uT-aT>=30);
    check("score100",uT>=100);
    check("pirate3",(game.stealCounts&&game.stealCounts.user||0)>=3);
    check("no_contract",win&&conCount===0);
    check("contracts3",conCount>=3);
    check("all_routes",win&&routesUsed===4);
    check("hard_win",win&&game.difficulty==="hard");
    check("wins5",nc.wins>=5);
    check("wins20",nc.wins>=20);
    if(fresh.length>0){const na=[...unlocked];setAch(na);saveLS("vm_ach",na);
      fresh.forEach((id,i)=>setTimeout(()=>{pushToast(id);SFX.play("achieve");},700+i*900));}
    setTimeout(()=>SFX.play(win?"win":uT<aT?"lose":"tie"),250);
    setGame(prev=>({...prev,_recorded:true}));
  },[game?.gameOver]);

  // AI turn
  useEffect(()=>{if(!game||game.gameOver||game.turnPlayer!=="ai")return;
    aiTimerRef.current=setTimeout(()=>{setGame(prev=>({...prev,phase:"aiTurn"}));
      aiTimer2Ref.current=setTimeout(()=>{setGame(prev=>{const dec=aiDecide(prev),ns=processTurn(prev,"ai",dec.action,dec.target);
        let lk=dec.action;if(dec.action==="place"&&cardVal(dec.target)===1&&prev.userBoard[cardDir(dec.target)].length>0)lk="steal";
        const dl=getDandolo(lang,lk,ns);ns.dandoloMsg=dl.text;ns.dandoloMood=dl.mood;
        if(!ns.gameOver&&ns.turnPlayer==="user"){ns.phase="selectCard";ns.selectedCard=null;}return ns;});
      },600+Math.random()*500);},300);
    return()=>{clearTimeout(aiTimerRef.current);clearTimeout(aiTimer2Ref.current);};},[game?.turnPlayer,game?.turnNumber]);

  // Action sounds (fires for both players via the game log)
  useEffect(()=>{if(!game||game.logs.length===0)return;
    const last=game.logs[game.logs.length-1];
    const map={stealHit:"steal",stealMiss:"place",place:"place",contract:"contract",discard:"discard"};
    if(map[last.type])SFX.play(map[last.type]);
  },[game?.logs.length]);

  const selectCard=(card)=>{if(!game||game.turnPlayer!=="user"||game.gameOver)return;SFX.unlock();SFX.play("click");setGame({...game,selectedCard:card,phase:"selectAction"});setContractDir(null);};
  const doAction=(action)=>{if(!game)return;
    if(action==="contract"){const dirs=getContractableDirs(game.userBoard,game.userCon);if(dirs.length===0)return;
      if(dirs.length===1){const ns=processTurn(game,"user","contract",dirs[0]);const dl=getDandolo(lang,"yourTurn",ns);ns.dandoloMsg=dl.text;ns.dandoloMood=dl.mood;ns.selectedCard=null;setGame(ns);}else setContractDir(dirs);return;}
    const card=game.selectedCard;if(!card)return;
    if(action==="place"){if(!canPlace(card,game.userBoard))return;const ns=processTurn(game,"user","place",card);let lk="yourTurn";if(cardVal(card)===1&&game.aiBoard[cardDir(card)].length>0)lk="stolen";const dl=getDandolo(lang,lk,ns);ns.dandoloMsg=dl.text;ns.dandoloMood=dl.mood;ns.selectedCard=null;setGame(ns);setContractDir(null);}
    else if(action==="discard"){const ns=processTurn(game,"user","discard",card);const dl=getDandolo(lang,"yourTurn",ns);ns.dandoloMsg=dl.text;ns.dandoloMood=dl.mood;ns.selectedCard=null;setGame(ns);setContractDir(null);}
  };
  const doContract=(dir)=>{const ns=processTurn(game,"user","contract",dir);const dl=getDandolo(lang,"yourTurn",ns);ns.dandoloMsg=dl.text;ns.dandoloMood=dl.mood;ns.selectedCard=null;setGame(ns);setContractDir(null);};
  const backToTitle=()=>{if(game&&!game.gameOver&&!window.confirm(t.confirmQuit))return;setGame(null);setContractDir(null);};

  const base={maxWidth:520,margin:"0 auto",padding:"8px 12px",fontFamily:"'Noto Serif JP','Georgia',serif",background:"linear-gradient(180deg,#F5ECD7 0%,#EDE0C8 100%)",minHeight:"100vh",color:"#3C2F1E"};

  const muteBtn=(<button data-tid="mute-btn" onClick={()=>{const m=!muted;setMuted(m);saveLS("vm_muted",m);}} style={{padding:"2px 6px",fontSize:12,background:"transparent",border:"1px solid #C4A882",borderRadius:3,cursor:"pointer"}}>{muted?"🔇":"🔊"}</button>);

  const achModal=showAch&&(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}} onClick={()=>setShowAch(false)}>
    <div style={{background:"#F5ECD7",padding:20,borderRadius:12,maxWidth:400,width:"calc(100% - 32px)",margin:16,border:"2px solid #C4A882"}} onClick={e=>e.stopPropagation()}>
      <h3 style={{margin:"0 0 8px",color:"#5C3317"}}>🏆 {t.ach.title} ({ach.length}/{ACH_IDS.length})</h3>
      <div style={{fontSize:12,color:"#8B7355",marginBottom:10}}>{t.ach.career}: {career.games}{t.stats.g} {career.wins}{t.stats.w} {career.losses}{t.stats.l} {career.draws}{t.stats.d}</div>
      <div style={{maxHeight:"55vh",overflowY:"auto"}}>
        {ACH_IDS.map(id=>{const u=achSet.has(id);return(<div key={id} style={{display:"flex",gap:10,alignItems:"center",padding:"7px 4px",borderBottom:"1px solid #E0D4BC",opacity:u?1:0.55}}>
          <span style={{fontSize:20,flexShrink:0}}>{u?"🏆":"🔒"}</span>
          <div><div style={{fontSize:13,fontWeight:700,color:u?"#8B5A00":"#5C4033"}}>{t.ach.list[id].name}</div>
          <div style={{fontSize:11,color:"#8B7355"}}>{t.ach.list[id].desc}</div></div>
        </div>);})}
      </div>
      <button onClick={()=>setShowAch(false)} style={{marginTop:12,padding:"8px 24px",background:"#8B4513",color:"#F5ECD7",border:"none",borderRadius:6,cursor:"pointer"}}>{t.close}</button>
    </div>
  </div>);

  const rulesModal=showRules&&(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}} onClick={()=>setShowRules(false)}>
    <div style={{background:"#F5ECD7",padding:24,borderRadius:12,maxWidth:400,margin:16,border:"2px solid #C4A882",maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
      <h3 style={{margin:"0 0 12px",color:"#5C3317"}}>{t.howToPlay}</h3>
      {t.rules.map((r,i)=><p key={i} style={{fontSize:13,margin:"8px 0",color:"#5C4033",lineHeight:1.5}}>{i+1}. {r}</p>)}
      <button onClick={()=>setShowRules(false)} style={{marginTop:12,padding:"8px 24px",background:"#8B4513",color:"#F5ECD7",border:"none",borderRadius:6,cursor:"pointer"}}>{t.close}</button>
    </div>
  </div>);

  // TITLE
  if(!game){return(<div style={base}>
    <div style={{textAlign:"center",paddingTop:36}}>
      <div style={{fontSize:14,color:"#8B7355",letterSpacing:4,marginBottom:8}}>⚓ ⚓ ⚓</div>
      <h1 style={{fontSize:22,fontWeight:800,color:"#5C3317",margin:"0 0 4px",lineHeight:1.3}}>{t.title}</h1>
      <p style={{fontSize:13,color:"#8B7355",margin:"0 0 20px",fontStyle:"italic"}}>{t.subtitle}</p>
      <div style={{width:90,height:90,margin:"0 auto 18px",borderRadius:"50%",border:"3px solid #C4A882",background:"radial-gradient(circle,#F5ECD7,#D4C4A8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:38}}>🧭</div>
      <StatsBar stats={stats} lang={lang}/>
      <div style={{marginBottom:10}}>
        <div style={{fontSize:11,color:"#8B7355",marginBottom:4}}>{t.difficulty.label}</div>
        <div style={{display:"inline-flex",border:"1px solid #C4A882",borderRadius:6,overflow:"hidden"}}>
          {DIFFS.map(d=><button key={d} data-tid={`diff-${d}`} onClick={()=>{setDiff(d);saveLS("vm_diff",d);}} style={{padding:"7px 16px",fontSize:12,border:"none",cursor:"pointer",background:diff===d?"#8B4513":"transparent",color:diff===d?"#F5ECD7":"#5C3317",fontWeight:diff===d?700:400,fontFamily:"inherit"}}>{t.difficulty[d]}</button>)}
        </div>
      </div>
      <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontSize:12,color:"#5C3317",cursor:"pointer",marginBottom:16}}>
        <input data-tid="event-toggle" type="checkbox" checked={eventOn} onChange={e=>{setEventOn(e.target.checked);saveLS("vm_event",e.target.checked);}}/>💨 {t.eventUI.label}
      </label>
      <div><button data-tid="start" onClick={startGame} style={{padding:"12px 40px",fontSize:16,fontWeight:700,background:"linear-gradient(135deg,#8B4513,#A0522D)",color:"#F5ECD7",border:"none",borderRadius:8,cursor:"pointer",letterSpacing:2,boxShadow:"0 4px 12px rgba(92,51,23,0.3)",fontFamily:"inherit"}}>{t.start}</button></div>
      <div style={{marginTop:16,display:"flex",justifyContent:"center",gap:8,flexWrap:"wrap"}}>
        <button onClick={()=>setLang(lang==="ja"?"en":"ja")} style={{padding:"6px 16px",fontSize:12,background:"transparent",border:"1px solid #C4A882",borderRadius:4,cursor:"pointer",color:"#5C3317",fontFamily:"inherit"}}>{lang==="ja"?"English":"日本語"}</button>
        <button onClick={()=>setShowRules(true)} style={{padding:"6px 16px",fontSize:12,background:"transparent",border:"1px solid #C4A882",borderRadius:4,cursor:"pointer",color:"#5C3317",fontFamily:"inherit"}}>{t.howToPlay}</button>
        <button data-tid="ach-btn" onClick={()=>setShowAch(true)} style={{padding:"6px 16px",fontSize:12,background:"transparent",border:"1px solid #C4A882",borderRadius:4,cursor:"pointer",color:"#5C3317",fontFamily:"inherit"}}>🏆 {t.ach.btn} ({ach.length}/{ACH_IDS.length})</button>
        {muteBtn}
      </div>
      <div style={{marginTop:32,fontSize:11,color:"#B8A88A"}}>v2.0 &copy; {t.credit}</div>
    </div>
    {rulesModal}
    {achModal}
  </div>);}

  // GAME
  const userTotal=totalScore(game.userBoard,game.userCon,game.event),aiTotal=totalScore(game.aiBoard,game.aiCon,game.event);
  const isUserTurn=game.turnPlayer==="user"&&!game.gameOver,sel=game.selectedCard;
  const canPlaceSel=sel&&canPlace(sel,game.userBoard),conDirs=getContractableDirs(game.userBoard,game.userCon);
  const windDir=game.event&&game.event.type==="wind"?game.event.dir:null;
  const userWon=game.gameOver&&userTotal>aiTotal;

  return(<div style={base}>
    <div style={{position:"fixed",top:10,left:0,right:0,display:"flex",flexDirection:"column",alignItems:"center",gap:6,zIndex:200,pointerEvents:"none"}}>
      {toasts.map(x=><div key={x.key} style={{background:"linear-gradient(135deg,#B8860B,#DAA520)",color:"#fff",padding:"8px 18px",borderRadius:8,boxShadow:"0 4px 12px rgba(0,0,0,.3)",fontSize:13,fontWeight:700,animation:"toastIn .4s ease both"}}>🏆 {t.ach.toast} — {t.ach.list[x.id].name}</div>)}
    </div>
    {userWon&&<Confetti/>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:"1px solid #C4A882",marginBottom:6}}>
      <div style={{fontSize:12,fontWeight:700,color:"#5C3317",display:"flex",alignItems:"center",gap:6}}>🧭 {t.deck}: {game.deck.length}{lang==="ja"?"枚":""}
        <span style={{fontSize:9,background:"#8B4513",color:"#F5ECD7",borderRadius:3,padding:"1px 5px",fontWeight:700}}>{t.difficulty[game.difficulty]}</span>
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center",fontSize:11}}>
        <span style={{color:"#8B7355"}}>{t.turn}: {Math.ceil(game.turnNumber/2)}</span>
        <button data-tid="home-btn" onClick={backToTitle} style={{padding:"2px 6px",fontSize:11,background:"transparent",border:"1px solid #C4A882",borderRadius:3,cursor:"pointer",color:"#5C3317"}}>⌂</button>
        {muteBtn}
        <button onClick={()=>setLang(lang==="ja"?"en":"ja")} style={{padding:"2px 6px",fontSize:10,background:"transparent",border:"1px solid #C4A882",borderRadius:3,cursor:"pointer",color:"#5C3317"}}>{lang==="ja"?"EN":"JP"}</button>
      </div>
    </div>
    <StatsBar stats={stats} lang={lang}/>
    <DandoloBar msg={game.dandoloMsg} mood={game.dandoloMood} lang={lang}/>
    {game.event&&(<div style={{display:"flex",alignItems:"center",gap:6,background:"#FDF6E3",border:"1px solid #D4A76A",borderRadius:6,padding:"4px 8px",marginBottom:8,fontSize:11,color:"#7A5C2E"}}>
      <span style={{fontSize:14}}>{EVENT_ICONS[game.event.type]}</span>
      <b style={{flexShrink:0}}>{t.eventUI.banner}: {eventName(game.event,t)}</b>
      <span style={{opacity:0.85}}>{t.events[game.event.type].desc}</span>
    </div>)}
    <div style={{display:"flex",justifyContent:"center",gap:16,marginBottom:8,padding:"6px 0"}}>
      <div style={{textAlign:"center"}}><div style={{fontSize:10,color:"#5C3317",fontWeight:700}}>{t.dandolo}</div><div key={`a${aiTotal}`} style={{fontSize:22,fontWeight:800,color:"#5C3317",animation:"scorePop .25s ease"}}>{aiTotal}</div></div>
      <div style={{fontSize:14,color:"#C4A882",alignSelf:"center",fontWeight:700}}>{t.vs}</div>
      <div style={{textAlign:"center"}}><div style={{fontSize:10,color:"#2471A3",fontWeight:700}}>{t.you}</div><div key={`u${userTotal}`} style={{fontSize:22,fontWeight:800,color:"#2471A3",animation:"scorePop .25s ease"}}>{userTotal}</div></div>
    </div>
    {DIRS.map(d=><DirectionRow key={d} dir={d} lang={lang} aiCards={game.aiBoard[d]} userCards={game.userBoard[d]} aiCon={game.aiCon[d]} userCon={game.userCon[d]} aiScore={calcScoreEx(game.aiBoard[d],game.aiCon[d],d,game.event)} userScore={calcScoreEx(game.userBoard[d],game.userCon[d],d,game.event)} lastPlaced={game.lastPlaced} windDir={windDir}/>)}
    {game.gameOver&&(<div style={{textAlign:"center",padding:20,margin:"12px 0",background:"linear-gradient(135deg,#5C3317,#8B4513)",borderRadius:12,color:"#F5ECD7",animation:"bannerIn .4s ease both"}}>
      <div style={{fontSize:18,fontWeight:800,marginBottom:4}}>{t.gameOver}</div>
      <div style={{fontSize:11,opacity:0.85,marginBottom:8}}>{t.difficulty[game.difficulty]}{game.event?` ・ ${EVENT_ICONS[game.event.type]} ${eventName(game.event,t)}`:""}</div>
      <div style={{fontSize:28,fontWeight:800,marginBottom:4}}>{userTotal} {t.vs} {aiTotal}</div>
      <div style={{fontSize:16,marginBottom:16}}>{userTotal>aiTotal?t.youWin:userTotal<aiTotal?t.youLose:t.draw}</div>
      <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
        <button data-tid="again" onClick={startGame} style={{padding:"10px 28px",fontSize:14,fontWeight:700,background:"#F5ECD7",color:"#5C3317",border:"none",borderRadius:8,cursor:"pointer",fontFamily:"inherit"}}>{t.playAgain}</button>
        <button data-tid="to-title" onClick={backToTitle} style={{padding:"10px 20px",fontSize:13,fontWeight:700,background:"transparent",color:"#F5ECD7",border:"1px solid #F5ECD7",borderRadius:8,cursor:"pointer",fontFamily:"inherit"}}>{t.toTitle}</button>
      </div>
    </div>)}
    {!game.gameOver&&(<div style={{margin:"8px 0"}}>
      <div style={{fontSize:11,fontWeight:700,color:"#5C4033",marginBottom:4}}>{t.hand} ({game.userHand.length})</div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap",padding:8,background:"#E8DDD0",borderRadius:8,minHeight:74,justifyContent:"center",opacity:isUserTurn?1:0.5}}>
        {game.userHand.map((card,i)=><HandCard key={`${card}-${i}`} card={card} lang={lang} idx={i} selected={sel===card} onClick={isUserTurn?()=>selectCard(card):undefined}/>)}
      </div>
    </div>)}
    {!game.gameOver&&(<div style={{marginTop:6}}>
      {game.phase==="aiTurn"&&<div style={{textAlign:"center",padding:10,color:"#8B7355",fontSize:12,fontStyle:"italic",animation:"turnPulse 1.2s ease infinite"}}>⏳ {t.aiThinking}</div>}
      {game.phase==="selectCard"&&isUserTurn&&<div style={{textAlign:"center",padding:8,color:"#2471A3",fontSize:12,fontWeight:700}}>⛵ {t.selectCard}</div>}
      {game.phase==="selectAction"&&isUserTurn&&!contractDir&&(<React.Fragment>
        <div style={{display:"flex",gap:6,justifyContent:"center"}}>
          <button data-tid="act-place" onClick={()=>doAction("place")} disabled={!canPlaceSel} style={{padding:"10px 18px",fontSize:13,fontWeight:700,background:canPlaceSel?"#27AE60":"#CCC",color:"#fff",border:"none",borderRadius:6,cursor:canPlaceSel?"pointer":"not-allowed",fontFamily:"inherit"}}>{t.actions.place}</button>
          <button data-tid="act-contract" onClick={()=>doAction("contract")} disabled={conDirs.length===0} style={{padding:"10px 18px",fontSize:13,fontWeight:700,background:conDirs.length>0?"#8B4513":"#CCC",color:"#fff",border:"none",borderRadius:6,cursor:conDirs.length>0?"pointer":"not-allowed",fontFamily:"inherit"}}>{t.actions.contract}</button>
          <button data-tid="act-discard" onClick={()=>doAction("discard")} style={{padding:"10px 18px",fontSize:13,fontWeight:700,background:"#C0392B",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>{t.actions.discard}</button>
        </div>
        <div style={{textAlign:"center",marginTop:6}}><button onClick={()=>setGame({...game,phase:"selectCard",selectedCard:null})} style={{padding:"3px 10px",fontSize:10,background:"transparent",border:"1px solid #C4A882",borderRadius:4,cursor:"pointer",color:"#8B7355",fontFamily:"inherit"}}>{t.reselect}</button></div>
      </React.Fragment>)}
      {contractDir&&(<div style={{textAlign:"center"}}>
        <div style={{fontSize:12,color:"#5C4033",marginBottom:6}}>{t.chooseDir}</div>
        <div style={{display:"flex",gap:6,justifyContent:"center"}}>
          {contractDir.map(d=><button key={d} data-tid="contract-dir" onClick={()=>doContract(d)} style={{padding:"10px 20px",fontSize:14,fontWeight:700,background:DIR_COLORS[d],color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>{t.dirs[d]}</button>)}
          <button onClick={()=>{setContractDir(null);setGame({...game,phase:"selectCard",selectedCard:null});}} style={{padding:"10px 14px",fontSize:12,background:"#888",color:"#fff",border:"none",borderRadius:6,cursor:"pointer"}}>✕</button>
        </div>
      </div>)}
    </div>)}
    {game.logs.length>0&&(<div style={{marginTop:10,padding:8,background:"#E8DDD0",borderRadius:8,fontSize:11,color:"#5C4033"}}>
      <div style={{fontWeight:700,marginBottom:3}}>📜 {t.log}</div>
      {game.logs.slice(-4).map((entry,i)=><div key={i} style={{padding:"2px 0",borderBottom:"1px solid #D4C4A8",opacity:0.55+(i*0.15)}}>{renderLog(entry,lang)}</div>)}
    </div>)}
    <div style={{textAlign:"center",marginTop:16,paddingBottom:12,fontSize:10,color:"#B8A88A"}}>v2.0 &copy; {t.credit}</div>
    {rulesModal}
    {achModal}
  </div>);
}

// Engine exposed for automated testing (harmless in production)
window.__VM={initGame,processTurn,aiDecide,calcScoreEx,totalScore,pickEvent,buildDeck,canPlace,getPlayableCards};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
